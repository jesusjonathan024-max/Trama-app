<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trama — Actualidad, Comunidad, Biblioteca y Arcade</title>
    <meta
      name="description"
      content="Explora artículos de Actualidad, debates en Comunidad, novelas y manhwas en Biblioteca y minijuegos en el Arcade de Trama."
    />
    <link rel="canonical" href="https://trama-app.netlify.app" />

    <!-- Open Graph / WhatsApp / Discord / Redes Sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trama" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://trama-app.netlify.app" />
    <meta property="og:title" content="Trama — Actualidad, Comunidad, Biblioteca y Arcade" />
    <meta
      property="og:description"
      content="Explora artículos de Actualidad, debates en Comunidad, novelas y manhwas en Biblioteca y minijuegos en el Arcade de Trama."
    />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trama — Actualidad, Comunidad, Biblioteca y Arcade" />
    <meta
      name="twitter:description"
      content="Explora artículos de Actualidad, debates en Comunidad, novelas y manhwas en Biblioteca y minijuegos en el Arcade de Trama."
    />

    <meta name="theme-color" content="#0F1115" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('trama_appearance_v1');
          var prefs = raw ? JSON.parse(raw) : {};
          var mode = prefs.themeMode === 'light' ? 'light' : 'dark';
          var accent = prefs.accentColor === 'violet' ? 'violet' : 'blue';
          var font =
            prefs.fontSize === 'large' || prefs.fontSize === 'xl'
              ? prefs.fontSize
              : 'normal';
          var root = document.documentElement;
          root.classList.toggle('dark', mode === 'dark');
          root.dataset.theme = mode;
          root.dataset.accent = accent;
          root.dataset.fontSize = font;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', mode === 'dark' ? '#0F1115' : '#F8FAFC');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.accent = 'blue';
          document.documentElement.dataset.fontSize = 'normal';
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Trama",
        "url": "https://trama-app.netlify.app",
        "inLanguage": "es",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "All",
        "description": "Explora artículos de Actualidad, debates en Comunidad, novelas y manhwas en Biblioteca y minijuegos en el Arcade de Trama.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[var(--bg-base)] text-[var(--text-main)] antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
