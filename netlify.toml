[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/ai?action=chat"
  status = 200

[[redirects]]
  from = "/api/ai/arcade-challenge"
  to = "/.netlify/functions/ai?action=arcade-challenge"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
