<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="trama-fav-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="fav-q-tl">
      <rect x="0" y="0" width="32" height="32" />
    </clipPath>
    <clipPath id="fav-q-tr">
      <rect x="32" y="0" width="32" height="32" />
    </clipPath>
    <clipPath id="fav-q-bl">
      <rect x="0" y="32" width="32" height="32" />
    </clipPath>
    <clipPath id="fav-q-br">
      <rect x="32" y="32" width="32" height="32" />
    </clipPath>

    <linearGradient id="fav-grad-tl" x1="6" y1="6" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="fav-grad-tr" x1="32" y1="6" x2="58" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fav-grad-bl" x1="6" y1="32" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="fav-grad-br" x1="32" y1="32" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Base oscura oficial Trama -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0F1115" stroke="#222836" stroke-width="1.4" />

  <!-- Órbita entrelazada de 4 cuadrantes con brillo neón sutil -->
  <g filter="url(#trama-fav-glow)">
    <!-- Cuadrante Superior Izquierdo: Cian Eléctrico (#06B6D4) -->
    <g clip-path="url(#fav-q-tl)">
      <rect x="8.5" y="8.5" width="47" height="47" rx="16.5" stroke="url(#fav-grad-tl)" stroke-width="2.4" />
      <ellipse cx="32" cy="32" rx="23.5" ry="12.2" transform="rotate(-38 32 32)" stroke="#06B6D4" stroke-width="2.2" stroke-opacity="0.92" />
      <ellipse cx="32" cy="32" rx="23.5" ry="12.2" transform="rotate(38 32 32)" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.72" />
    </g>

    <!-- Cuadrante Superior Derecho: Verde Esmeralda (#10B981) -->
    <g clip-path="url(#fav-q-tr)">
      <rect x="8.5" y="8.5" width="47" height="47" rx="16.5" stroke="url(#fav-grad-tr)" stroke-width="2.4" />
      <ellipse cx="32" cy="32" rx="23.5" ry="12.2" transform="rotate(-38 32 32)" stroke="#34D399" stroke-width="1.8" stroke-opacity="0.72" />
      <ellipse cx="32" cy="32" rx="23.5" ry="12.2" transform="rotate(38 32 32)" stroke="#10B981" stroke-width="2.2" stroke-opacity="0.92" />
    </g>

    <!-- Cuadrante Inferior Izquierdo: Violeta Neón (#8B5CF6) -->
    <g clip-path="url(#fav-q-bl)">
      <rect x="8.5" y="8.5" width="47" height="47" rx="16.5" stroke="url(#fav-grad-bl)" stroke-width="2.4" />
      <ellipse cx="32" cy="32" rx="23.5" ry="12.2" transform="rotate(-38 32 32)" stroke="#A78BFA" stroke-width="1.8" stroke-opacity="0.72" />
      <ellipse cx="32" cy="32" rx="23.5" ry="12.2" transform="rotate(38 32 32)" stroke="#8B5CF6" stroke-width="2.2" stroke-opacity="0.92" />
    </g>

    <!-- Cuadrante Inferior Derecho: Naranja Coral (#F97316) -->
    <g clip-path="url(#fav-q-br)">
      <rect x="8.5" y="8.5" width="47" height="47" rx="16.5" stroke="url(#fav-grad-br)" stroke-width="2.4" />
      <ellipse cx="32" cy="32" rx="23.5" ry="12.2" transform="rotate(-38 32 32)" stroke="#F97316" stroke-width="2.2" stroke-opacity="0.92" />
      <ellipse cx="32" cy="32" rx="23.5" ry="12.2" transform="rotate(38 32 32)" stroke="#FB923C" stroke-width="1.8" stroke-opacity="0.72" />
    </g>
  </g>

  <!-- Micro-ícono Superior Izquierdo: Libro abierto (Cian Eléctrico) -->
  <g transform="translate(14.5 14.5)">
    <circle cx="0" cy="0" r="6.2" fill="#0F1115" stroke="#06B6D4" stroke-width="1.2" />
    <path d="M-3.5 -1.8 C-2.2 -2.4 -0.9 -2.2 0 -1.3 C0.9 -2.2 2.2 -2.4 3.5 -1.8 L3.5 2.1 C2.2 1.6 0.9 1.7 0 2.5 C-0.9 1.7 -2.2 1.6 -3.5 2.1 Z" stroke="#22D3EE" stroke-width="1.15" stroke-linejoin="round" fill="none" />
    <line x1="0" y1="-1.3" x2="0" y2="2.4" stroke="#22D3EE" stroke-width="1" />
  </g>

  <!-- Micro-ícono Superior Derecho: Globo terráqueo (Verde Esmeralda) -->
  <g transform="translate(49.5 14.5)">
    <circle cx="0" cy="0" r="6.2" fill="#0F1115" stroke="#10B981" stroke-width="1.2" />
    <circle cx="0" cy="0" r="3.4" stroke="#34D399" stroke-width="1.1" />
    <ellipse cx="0" cy="0" rx="1.6" ry="3.4" stroke="#34D399" stroke-width="0.95" />
    <line x1="-3.3" y1="0" x2="3.3" y2="0" stroke="#34D399" stroke-width="0.95" />
  </g>

  <!-- Micro-ícono Inferior Izquierdo: Burbuja de diálogo (Violeta Neón) -->
  <g transform="translate(14.5 49.5)">
    <circle cx="0" cy="0" r="6.2" fill="#0F1115" stroke="#8B5CF6" stroke-width="1.2" />
    <path d="M-3.3 -2.2 H3.3 A0.9 0.9 0 0 1 4.2 -1.3 V1.5 A0.9 0.9 0 0 1 3.3 2.4 H-0.4 L-2.4 3.8 L-2 2.4 H-3.3 A0.9 0.9 0 0 1 -4.2 1.5 V-1.3 A0.9 0.9 0 0 1 -3.3 -2.2 Z" stroke="#A78BFA" stroke-width="1.1" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Micro-ícono Inferior Derecho: Control de videojuegos (Naranja Coral) -->
  <g transform="translate(49.5 49.5)">
    <circle cx="0" cy="0" r="6.2" fill="#0F1115" stroke="#F97316" stroke-width="1.2" />
    <path d="M-3.5 -1.4 H3.5 C4.1 -1.4 4.4 -0.9 4.2 0.3 L3.8 2.1 C3.6 2.6 3.1 2.7 2.6 2.2 L1.7 1.3 H-1.7 L-2.6 2.2 C-3.1 2.7 -3.6 2.6 -3.8 2.1 L-4.2 0.3 C-4.4 -0.9 -4.1 -1.4 -3.5 -1.4 Z" stroke="#FB923C" stroke-width="1.05" stroke-linejoin="round" fill="none" />
    <path d="M-2.2 -0.2 H-1 M-1.6 -0.8 V0.4" stroke="#FDBA74" stroke-width="0.9" stroke-linecap="round" />
    <circle cx="1.6" cy="-0.4" r="0.55" fill="#FDBA74" />
    <circle cx="2.5" cy="0.3" r="0.55" fill="#FDBA74" />
  </g>

  <!-- Halo central protector para nitidez máxima de la T -->
  <circle cx="32" cy="32" r="13.5" fill="#0F1115" fill-opacity="0.92" />

  <!-- Letra "T" geométrica blanca con corte dinámico en la base -->
  <path
    d="M19.5 20.5 H44.5 L42.3 26.2 H35.4 V42.2 L28.6 46.2 V26.2 H21.7 Z"
    fill="#FFFFFF"
  />
</svg>
